<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .weather-container {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      margin-bottom: 1rem;
    }
    input {
      padding: 0.5rem;
      width: 70%;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-size: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      border: none;
      background: #4a90e2;
      color: white;
      font-size: 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      margin-left: 0.5rem;
    }
    button:hover {
      background: #357ABD;
    }
    .weather-result {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="weather-container">
    <h1>Weather Checker</h1>
    <input type="text" id="locationInput" placeholder="Enter location...">
    <button onclick="getWeather()">Check</button>
    <div class="weather-result" id="weatherResult"></div>
  </div>

  <script>
    async function getWeather() {
      const location = document.getElementById('locationInput').value;
      const resultDiv = document.getElementById('weatherResult');

      if (!location) {
        resultDiv.innerHTML = 'Please enter a location.';
        return;
      }

      const apiKey = 'a790d10d4dfc4ab69f680803251904';
      const url = `http://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${location}&aqi=yes`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.error) {
          resultDiv.innerHTML = `Error: ${data.error.message}`;
        } else {
          const temp = data.current.temp_c;
          const condition = data.current.condition.text;
          const icon = data.current.condition.icon;
          resultDiv.innerHTML = `
            <p><strong>${data.location.name}, ${data.location.country}</strong></p>
            <img src="${icon}" alt="Weather icon">
            <p><strong>${temp}&deg;C</strong> - ${condition}</p>
          `;
        }
      } catch (error) {
        resultDiv.innerHTML = 'Failed to fetch weather data.';
        console.error(error);
      }
    }
  </script>
</body>
</html>
